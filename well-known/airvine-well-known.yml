summary: >-
  Airvine publishes no /.well-known/ discovery surface on any host. The WordPress marketing site
  (airvine.com / www.airvine.com), the WordPress partner portal (partner.airvine.com) and the
  collateral CDN (media.airvine.com) each answer every /.well-known/* path, /llms.txt and
  /security.txt with a real 404 HTML body; a control path with a random suffix
  (/.well-known/zz-control-3588) also returned 404, so there is no soft-200 catch-all. No
  agent card, no OAuth/OIDC metadata, no api-catalog, no security.txt. The candidate developer
  hosts developer.airvine.com, docs.airvine.com and api.airvine.com do not resolve in DNS.
  No WellKnown or SecurityTxt pointer is wired because nothing was served.
